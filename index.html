<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Vice City Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gta: {
                            pink: '#FF007F',
                            cyan: '#00F0FF',
                            purple: '#8A2BE2',
                            sunset: '#FF8C00',
                            dark: '#0a0a0a',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Font Poppins & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 0, 127, 0.5); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.8); }
        
        /* Efek Glow Animasi */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
            50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }
        }
        .animate-glow { animation: pulse-glow 3s infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-black text-slate-100 h-screen overflow-hidden flex transition-colors duration-300">

    <!-- Mobile Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-black/40 backdrop-blur-xl border-r border-gta-cyan/30 text-slate-300 flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-[0_0_20px_rgba(0,240,255,0.1)]">
        <div class="flex flex-col h-full overflow-hidden">
            <div class="p-4 flex items-center justify-between border-b border-gta-cyan/20">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-gta-pink to-gta-cyan flex items-center justify-center text-white font-bold shadow-[0_0_15px_rgba(255,0,127,0.5)]">
                        <i class="fa-solid fa-gamepad text-sm"></i>
                    </div>
                    <span class="font-bold text-xl text-transparent bg-clip-text bg-gradient-to-r from-gta-pink to-gta-cyan tracking-wider">ViceAI</span>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="p-3">
                <button onclick="createNewChat()" class="w-full flex items-center justify-center space-x-2 py-3 px-4 bg-gta-pink hover:bg-gta-purple text-white font-bold rounded-xl transition-all shadow-[0_0_15px_rgba(255,0,127,0.5)] active:scale-[0.98]">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>Chat Baru</span>
                </button>
            </div>

            <div class="px-4 py-2 text-xs font-semibold uppercase tracking-wider text-gta-cyan">
                Riwayat Misi
            </div>

            <div id="chatHistoryList" class="flex-1 overflow-y-auto px-3 space-y-1 py-1"></div>
        </div>

        <div class="p-3 border-t border-gta-cyan/20 space-y-2">
            <button onclick="toggleTheme()" class="w-full flex items-center justify-between py-2 px-3 hover:bg-white/5 rounded-xl transition-colors text-sm text-slate-300">
                <div class="flex items-center space-x-3">
                    <i id="themeIcon" class="fa-solid fa-moon w-5 text-center text-gta-cyan"></i>
                    <span id="themeText">Mode Gelap</span>
                </div>
                <div class="w-8 h-4 bg-slate-700 rounded-full relative p-0.5 transition-colors" id="themeSwitchTrack">
                    <div id="themeSwitchThumb" class="w-3 h-3 bg-white rounded-full transition-transform transform translate-x-0"></div>
                </div>
            </button>

            <div class="flex items-center justify-between py-2 px-3 rounded-xl bg-white/5 border border-gta-purple/30">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-gta-purple flex items-center justify-center text-white font-bold text-sm shadow-[0_0_10px_rgba(138,43,226,0.5)]">
                        EV
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-white">Evan Vice</span>
                        <span class="text-[10px] text-gta-cyan font-semibold">Kingpin Status</span>
                    </div>
                </div>
                <button onclick="clearAllData()" title="Hapus Semua Riwayat" class="text-slate-500 hover:text-gta-pink p-1.5 rounded-lg transition-colors">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-transparent">
        <header class="h-14 border-b border-gta-cyan/20 flex items-center justify-between px-4 z-10 bg-black/20 backdrop-blur-md">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-300 hover:text-white p-2 rounded-lg">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <span id="currentChatTitle" class="font-bold text-sm sm:text-base text-white truncate max-w-[200px] sm:max-w-xs tracking-wide">Percakapan Baru</span>
                    <span class="bg-gta-cyan/20 text-gta-cyan border border-gta-cyan text-[10px] px-2 py-0.5 rounded-full font-bold tracking-wider uppercase shadow-[0_0_10px_rgba(0,240,255,0.4)]">Groq x Vice City</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="exportChat()" title="Ekspor Percakapan" class="p-2 text-slate-400 hover:text-gta-cyan rounded-lg hover:bg-white/5 transition-colors">
                    <i class="fa-solid fa-download text-sm"></i>
                </button>
                <div class="h-4 w-[1px] bg-gta-cyan/30"></div>
                <div class="flex items-center space-x-1.5 text-xs text-slate-300 px-2 py-1 bg-black/40 border border-gta-cyan/20 rounded-lg">
                    <span class="w-2 h-2 rounded-full bg-gta-pink animate-ping"></span>
                    <span class="font-bold text-gta-cyan tracking-wider">ONLINE</span>
                </div>
            </div>
        </header>

        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
            <div id="welcomeState" class="h-full flex flex-col items-center justify-center text-center max-w-lg mx-auto space-y-6 py-12">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-gta-pink to-gta-cyan flex items-center justify-center text-white text-4xl shadow-[0_0_30px_rgba(255,0,127,0.6)] animate-glow">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="space-y-2">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-gta-pink to-gta-cyan">Welcome to Vice City, Evan.</h1>
                    <p class="text-sm text-slate-400 font-medium">Siap untuk misi hari ini? Tanyakan apa saja ke NexusAI.</p>
                </div>
            </div>

            <div id="messageFeed" class="space-y-6 max-w-3xl mx-auto w-full hidden"></div>
        </div>

        <div class="p-4 bg-black/40 backdrop-blur-md border-t border-gta-cyan/20">
            <div class="max-w-3xl mx-auto">
                <form id="chatForm" onsubmit="handleChatSubmit(event)" class="relative flex items-center">
                    <textarea 
                        id="userInput" 
                        rows="1" 
                        placeholder="Ketik pesan ke ViceAI..." 
                        class="w-full pl-4 pr-12 py-3.5 bg-black/50 border border-gta-purple/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-gta-cyan focus:border-transparent text-sm resize-none max-h-32 text-white placeholder-slate-500 shadow-[inset_0_0_10px_rgba(138,43,226,0.2)]"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    
                    <button 
                        type="submit" 
                        id="sendButton"
                        class="absolute right-2.5 bottom-2.5 w-9 h-9 bg-gta-cyan hover:bg-gta-pink text-black font-bold rounded-xl flex items-center justify-center transition-all shadow-[0_0_15px_rgba(0,240,255,0.5)] disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <i class="fa-solid fa-arrow-up text-sm"></i>
                    </button>
                </form>
                <div class="text-center mt-3">
                    <span class="text-[11px] text-slate-500 font-medium tracking-wide">NexusAI terhubung langsung dengan Groq API x Vice City Vibes.</span>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-black/80 backdrop-blur-md text-white px-4 py-3 rounded-xl shadow-[0_0_20px_rgba(0,240,255,0.3)] border border-gta-cyan flex items-center space-x-3 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-gta-cyan"></i>
        <span id="toastMessage">Pesan berhasil disalin!</span>
    </div>

    <script src="config.js"></script>
    
    <!-- JavaScript Logic -->
    <script>
        let chats = JSON.parse(localStorage.getItem('nexus_chats')) || [];
        let currentChatId = localStorage.getItem('nexus_current_chat_id') || null;

        window.addEventListener('DOMContentLoaded', () => {
            // Paksa dark mode terus-terusan untuk nuansa GTA
            document.documentElement.classList.add('dark');
            updateThemeUI(true);
            
            if (chats.length === 0) {
                createNewChat();
            } else {
                if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                    currentChatId = chats[0].id;
                }
                loadChat(currentChatId);
            }
            renderChatHistory();
        });

        function toggleTheme() {
            showToast('Mode GTA Vice City tidak bisa diganti! 🌴', 'fa-solid fa-triangle-exclamation text-gta-pink');
        }

        function updateThemeUI(isDark) {
            // UI Theme dibiarkan dark
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            icon.className = 'fa-solid fa-sun w-5 text-center text-gta-cyan';
            text.textContent = 'Vice City Mode';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                document.getElementById('chatForm').requestSubmit();
            }
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Misi Baru',
                messages: []
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            loadChat(currentChatId);
            renderChatHistory();
            if (window.innerWidth < 768) {
                toggleSidebar();
            }
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            localStorage.setItem('nexus_current_chat_id', chatId);
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            document.getElementById('currentChatTitle').textContent = chat.title;
            renderMessages(chat.messages);
            renderChatHistory();
        }

        function saveChats() {
            localStorage.setItem('nexus_chats', JSON.stringify(chats));
        }

        function renderChatHistory() {
            const listContainer = document.getElementById('chatHistoryList');
            listContainer.innerHTML = '';

            if (chats.length === 0) {
                listContainer.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center">Belum ada riwayat misi.</div>`;
                return;
            }

            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-sm transition-all ${isActive ? 'bg-gta-purple/30 border border-gta-purple text-white font-medium shadow-[0_0_10px_rgba(138,43,226,0.3)]' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200 border border-transparent'}`;
                item.onclick = () => loadChat(chat.id);
                
                item.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden flex-1 mr-2">
                        <i class="fa-solid fa-location-dot text-xs ${isActive ? 'text-gta-cyan' : 'text-slate-500'}"></i>
                        <span class="truncate text-xs">${escapeHTML(chat.title)}</span>
                    </div>
                    <button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-gta-pink p-1 rounded transition-opacity">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                listContainer.appendChild(item);
            });
        }

        function deleteChat(chatId) {
            chats = chats.filter(c => c.id !== chatId);
            saveChats();
            if (chats.length === 0) {
                createNewChat();
            } else if (currentChatId === chatId) {
                loadChat(chats[0].id);
            } else {
                renderChatHistory();
            }
            showToast('Misi dihapus', 'fa-solid fa-trash text-gta-pink');
        }

        function clearAllData() {
            if (confirm('Apakah Anda yakin ingin menghapus seluruh riwayat misi?')) {
                chats = [];
                localStorage.removeItem('nexus_chats');
                localStorage.removeItem('nexus_current_chat_id');
                createNewChat();
                showToast('Semua riwayat berhasil dibersihkan', 'fa-solid fa-triangle-exclamation text-gta-pink');
            }
        }

        function renderMessages(messages) {
            const welcomeState = document.getElementById('welcomeState');
            const messageFeed = document.getElementById('messageFeed');

            if (messages.length === 0) {
                welcomeState.classList.remove('hidden');
                messageFeed.classList.add('hidden');
                messageFeed.innerHTML = '';
                return;
            }

            welcomeState.classList.add('hidden');
            messageFeed.classList.remove('hidden');
            messageFeed.innerHTML = '';

            messages.forEach((msg) => {
                const isUser = msg.role === 'user';
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex items-start space-x-3 sm:space-x-4 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
                
                msgDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-white text-xs font-bold ${isUser ? 'bg-gta-pink shadow-[0_0_10px_rgba(255,0,127,0.6)]' : 'bg-gradient-to-tr from-gta-cyan to-gta-purple shadow-[0_0_10px_rgba(0,240,255,0.6)]'}">
                        ${isUser ? 'EV' : '<i class="fa-solid fa-robot"></i>'}
                    </div>
                    <div class="flex-1 space-y-1 overflow-hidden ${isUser ? 'text-right' : 'text-left'}">
                        <div class="text-xs font-semibold text-slate-400">${isUser ? 'Anda' : 'ViceAI'}</div>
                        <div class="inline-block p-4 rounded-2xl text-sm leading-relaxed max-w-full text-left ${isUser ? 'bg-gradient-to-r from-gta-pink to-purple-600 text-white rounded-tr-none shadow-[0_0_15px_rgba(255,0,127,0.3)]' : 'bg-black/60 backdrop-blur-md border border-gta-cyan/30 text-slate-200 rounded-tl-none shadow-[0_0_15px_rgba(0,240,255,0.1)]'}">
                            <div class="whitespace-pre-wrap break-words">${escapeHTML(msg.content)}</div>
                        </div>
                    </div>
                `;
                messageFeed.appendChild(msgDiv);
            });

            scrollToBottom();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function sendPrompt(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('chatForm').requestSubmit();
        }

        // Integrasi Groq API
        async function handleChatSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            input.value = '';
            input.style.height = 'auto';

            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            if (chat.messages.length === 0) {
                chat.title = prompt.length > 30 ? prompt.substring(0, 30) + '...' : prompt;
            }

            chat.messages.push({ role: 'user', content: prompt });
            saveChats();
            renderMessages(chat.messages);
            renderChatHistory();

            const sendBtn = document.getElementById('sendButton');
            sendBtn.disabled = true;

            chat.messages.push({ role: 'assistant', content: 'Sedang berpikir...' });
            saveChats();
            renderMessages(chat.messages);

            try {
                const apiKey = GROQ_API_KEY; 
                
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: chat.messages.filter(m => m.content !== 'Sedang berpikir...')
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0].message.content) {
                    const aiResponseText = data.choices[0].message.content;
                    chat.messages[chat.messages.length - 1].content = aiResponseText;
                } else {
                    console.error("Error dari Groq:", data);
                    chat.messages[chat.messages.length - 1].content = "Gagal memproses respons. Cek Console (F12) untuk detail.";
                }

                saveChats();
                renderMessages(chat.messages);

            } catch (error) {
                chat.messages[chat.messages.length - 1].content = "Gagal terhubung ke server AI. Periksa koneksi internet.";
                saveChats();
                renderMessages(chat.messages);
                console.error(error);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function exportChat() {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || chat.messages.length === 0) {
                showToast('Tidak ada pesan untuk diekspor', 'fa-solid fa-triangle-exclamation text-gta-pink');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chat, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${chat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Misi berhasil diekspor!', 'fa-solid fa-circle-check text-gta-cyan');
        }

        function showToast(message, iconClass = 'fa-solid fa-circle-check text-gta-cyan') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;
            toastIcon.className = iconClass;

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
